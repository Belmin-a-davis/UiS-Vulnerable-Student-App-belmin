server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    client_max_body_size 12m;

    location /static/ {
        alias /var/www/static/;
        autoindex off;          # no directory listings
    }

    # NOTE: there is intentionally no "location /uploads/" any more.
    # It used to serve the upload directory straight from disk with autoindex on,
    # bypassing every authorisation check in the application.
    # /uploads/<file> is now proxied to the backend like any other route.

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Server;
    }
}
